<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassenblatt holen</title>
<meta name="description" content="Kassenblatt für Android bei Google Play laden.">
<style>
  :root {
    --ground: #f7f9f2;
    --panel: #ffffff;
    --text: #1f2b1f;
    --muted: #4b5a4b;
    --accent: #2f7d32;
    --on-accent: #ffffff;
    --border: #d5dccb;
    --link: #1f5f22;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #121a14;
      --panel: #1b261d;
      --text: #eef3e6;
      --muted: #b9c4b3;
      --accent: #6fcf73;
      --on-accent: #0c1a0e;
      --border: #2f3d31;
      --link: #9ee89f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 64px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  .store-links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
    margin: 0 0 24px;
  }
  a.store-btn {
    display: block;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 14px 18px;
    border-radius: 12px;
    text-decoration: none;
    border: 1px solid var(--border);
  }
  a.store-btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  a.store-btn small { display: block; font-weight: 500; font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }
  #detect-note {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 8px 0 32px;
  }
  nav.back { margin-top: 24px; }
  nav.back a { color: var(--link); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Kassenblatt holen</h1>
  <p class="lead">Für Android bei Google Play. / For Android on Google Play.</p>

  <div class="store-links" id="store-links">
    <a class="store-btn" id="link-android" href="https://play.google.com/store/apps/details?id=com.syntheticm2m.kassenbuch">
      Google Play (Android)
      <small>Kostenlos laden, Pro einmalig 9,99 € / Free download, Pro one-time 9,99 €</small>
    </a>
  </div>

  <p id="detect-note" role="status" aria-live="polite"></p>

  <nav class="back"><a href="index.html">&larr; Kassenblatt</a></nav>

</div>

<script>
  // STORE_URLS: the ONLY place store links live on this page.
  var STORE_URLS = {
    android: "https://play.google.com/store/apps/details?id=com.syntheticm2m.kassenbuch"
  };

  (function () {
    var ua = (navigator.userAgent || "").toLowerCase();
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var isAndroid = /android/.test(ua);
    var note = document.getElementById("detect-note");

    // The store button is always visible as a plain link. On Android, redirect to
    // Google Play after a short pause; the button remains a working fallback.
    if (isIOS) {
      note.textContent = "Kassenblatt gibt es derzeit für Android. / Kassenblatt is currently available for Android.";
    } else if (isAndroid) {
      note.textContent = "Android erkannt, Weiterleitung zu Google Play …";
      setTimeout(function () { window.location.href = STORE_URLS.android; }, 900);
    } else {
      note.textContent = "Derzeit für Android erhältlich. / Currently available for Android.";
    }
  })();
</script>

</body>
</html>
